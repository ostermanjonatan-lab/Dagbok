<title>Dagbok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: en smal skrivspalt, flikar överst, datumet är det största på dagvyn */
:root {
  --bg: #f3f3ef;
  --surface: #fcfcfa;
  --text: #1f2226;
  --muted: #6d7177;
  --line: #dcddd7;
  --accent: #2c4f86;
  --accent-text: #fff;
  --danger: #a33b2b;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --surface: #1f2228; --text: #e6e7ea; --muted: #959aa3;
    --line: #2f333a; --accent: #8fb0e6; --accent-text: #16181c; --danger: #e0806f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --surface: #1f2228; --text: #e6e7ea; --muted: #959aa3;
  --line: #2f333a; --accent: #8fb0e6; --accent-text: #16181c; --danger: #e0806f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--sans);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.wrap { padding-block: 8px 48px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 2;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.tabs { display: flex; gap: 20px; }
.tabs button {
  border: 0; background: none; cursor: pointer;
  color: var(--muted);
  padding: 12px 0 10px;
  border-bottom: 2px solid transparent;
}
.tabs button.on { color: var(--text); border-bottom-color: var(--text); }

.daynav { display: flex; align-items: center; gap: 4px; margin: 12px 0 2px; }
.icon {
  width: 40px; height: 40px; flex: none;
  border: 0; background: none; border-radius: 8px; cursor: pointer;
  font-size: 28px; line-height: 1; color: var(--muted);
}
.icon:active { background: var(--line); }
.icon:disabled { opacity: .3; cursor: default; }
.date { position: relative; flex: 1; min-width: 0; }
#date-label {
  display: block;
  font-family: var(--serif);
  font-size: 22px; font-weight: 600; line-height: 1.25;
}
/* Datumväljaren ligger osynlig ovanpå rubriken så att ett tryck öppnar den */
#date-pick { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

.link {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent);
  text-decoration: underline; text-underline-offset: 3px;
}
#to-today { margin-left: 44px; font-size: 14px; }
.danger { color: var(--danger); }

form { margin-top: 16px; }
.field { display: block; margin: 0 0 18px; padding: 0; border: 0; min-width: 0; }
.field > span, .field > legend {
  display: block; padding: 0; margin-bottom: 4px;
  font-size: 14px; color: var(--muted);
}
input:not([type]), input[type="search"], textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 16px;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--muted); }
textarea {
  resize: none; overflow: hidden;
  font-family: var(--serif); font-size: 17px; line-height: 1.55;
}
textarea.main { font-size: 19px; border-color: var(--accent); }

.row { display: flex; gap: 16px; align-items: flex-start; }
.mood { flex: 1; min-width: 0; }
.sleep { width: 110px; flex: none; }
.scale {
  display: flex; overflow: hidden;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
}
.scale button {
  flex: 1; height: 44px; cursor: pointer;
  border: 0; border-left: 1px solid var(--line); background: none;
}
.scale button:first-child { border-left: 0; }
.scale button[aria-checked="true"] { background: var(--accent); color: var(--accent-text); }

.foot {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: 14px; color: var(--muted); min-height: 20px;
}
.confirm { display: flex; gap: 14px; align-items: baseline; }

#search { margin: 16px 0 4px; }
.month {
  font-size: 14px; font-weight: 400; color: var(--muted);
  margin: 24px 0 0; padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.month::first-letter { text-transform: uppercase; }
.item {
  display: block; width: 100%; text-align: left; cursor: pointer;
  border: 0; border-bottom: 1px solid var(--line); background: none;
  padding: 12px 0;
}
.item .when { font-size: 14px; color: var(--muted); }
.item.today .when { color: var(--accent); }
.item .what {
  font-family: var(--serif); font-size: 17px; margin: 2px 0;
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.item .meta { font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); margin-top: 24px; }
mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; border-radius: 2px; }

.backup { margin-top: 40px; }
.backup h2 { font-size: 16px; margin: 0 0 2px; }
.muted { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.buttons button {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 9px 14px; cursor: pointer;
}
.buttons button:active { background: var(--line); }
#backup-msg { margin: 10px 0 0; }
</style>

<header class="bar">
  <nav class="tabs wrap" aria-label="Vyer">
    <button type="button" id="tab-day" class="on">Dag</button>
    <button type="button" id="tab-all">Alla dagar</button>
  </nav>
</header>

<main class="wrap">
  <section id="view-day">
    <div class="daynav">
      <button type="button" class="icon" id="prev" aria-label="Föregående dag">&#8249;</button>
      <label class="date">
        <span id="date-label"></span>
        <input type="date" id="date-pick" aria-label="Välj datum">
      </label>
      <button type="button" class="icon" id="next" aria-label="Nästa dag">&#8250;</button>
    </div>
    <button type="button" class="link" id="to-today" hidden>Gå till idag</button>

    <form id="entry" autocomplete="off">
      <label class="field">
        <span>Det viktigaste som hänt</span>
        <textarea id="f-highlight" rows="2" class="main"></textarea>
      </label>
      <label class="field">
        <span>Anteckningar</span>
        <textarea id="f-notes" rows="8"></textarea>
      </label>
      <div class="row">
        <fieldset class="field mood">
          <legend>Humör, 1 till 5</legend>
          <div class="scale" id="f-mood" role="radiogroup">
            <button type="button" role="radio" data-v="1">1</button>
            <button type="button" role="radio" data-v="2">2</button>
            <button type="button" role="radio" data-v="3">3</button>
            <button type="button" role="radio" data-v="4">4</button>
            <button type="button" role="radio" data-v="5">5</button>
          </div>
        </fieldset>
        <label class="field sleep">
          <span>Sömn, timmar</span>
          <input id="f-sleep" inputmode="decimal" placeholder="7,5">
        </label>
      </div>
      <label class="field">
        <span>Tacksam för</span>
        <input id="f-grateful">
      </label>
      <label class="field">
        <span>Taggar</span>
        <input id="f-tags" placeholder="jobb, träning, familj" autocapitalize="none">
      </label>
    </form>

    <div class="foot">
      <span id="status" aria-live="polite"></span>
      <button type="button" class="link danger" id="delete" hidden>Ta bort dagen</button>
      <span class="confirm" id="confirm" hidden>
        <button type="button" class="link danger" id="delete-yes">Ta bort</button>
        <button type="button" class="link" id="delete-no">Avbryt</button>
      </span>
    </div>
  </section>

  <section id="view-all" hidden>
    <input type="search" id="search" placeholder="Sök i dagboken" aria-label="Sök">
    <div id="list"></div>

    <div class="backup">
      <h2>Säkerhetskopia</h2>
      <p class="muted" id="where">Sparas i den här webbläsaren.</p>
      <div class="buttons">
        <button type="button" id="export" hidden>Exportera fil</button>
        <button type="button" id="import">Importera fil</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <p class="muted" id="backup-msg" aria-live="polite"></p>
    </div>
  </section>
</main>

<script>
'use strict';

const CACHE_KEY = 'dagbok.v1';
const $ = (id) => document.getElementById(id);

const fields = {
  highlight: $('f-highlight'),
  notes: $('f-notes'),
  grateful: $('f-grateful'),
  sleep: $('f-sleep'),
  tags: $('f-tags'),
};
const moodButtons = [...$('f-mood').querySelectorAll('button')];

let entries = loadCache();
let current = todayKey();
let view = 'day';
let saveTimer = null;
let col = null;       // dagbokens samling i databasen, om den finns
let downloads = null;

/* Lokal kopia, används direkt vid start och om databasen saknas */

function loadCache() {
  try {
    const data = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    return data && typeof data === 'object' ? data : {};
  } catch {
    return {};
  }
}

function writeCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(entries)); } catch {}
}

/* Datum och tal */

function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayKey() { return keyOf(new Date()); }

function parseKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function shiftKey(key, days) {
  const d = parseKey(key);
  d.setDate(d.getDate() + days);
  return keyOf(d);
}

const dateFmt = new Intl.DateTimeFormat('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const monthFmt = new Intl.DateTimeFormat('sv-SE', { month: 'long', year: 'numeric' });
const timeFmt = new Intl.DateTimeFormat('sv-SE', { hour: '2-digit', minute: '2-digit', hour12: false });

const fmtDate = (key) => dateFmt.format(parseKey(key));
const fmtNumber = (n) => String(Math.round(n * 10) / 10).replace('.', ',');

function parseNumber(str) {
  const n = parseFloat(String(str).replace(',', '.').replace(/\s/g, ''));
  return Number.isFinite(n) ? n : null;
}

function clean(e) {
  return {
    highlight: String(e.highlight || ''),
    notes: String(e.notes || ''),
    grateful: String(e.grateful || ''),
    tags: Array.isArray(e.tags) ? e.tags.map(String) : [],
    mood: Number.isInteger(e.mood) && e.mood >= 1 && e.mood <= 5 ? e.mood : null,
    sleep: typeof e.sleep === 'number' && e.sleep >= 0 && e.sleep <= 24 ? e.sleep : null,
    updated: typeof e.updated === 'string' ? e.updated : new Date().toISOString(),
  };
}

/* Databasen. Varje dag är ett eget dokument i en privat samling per person. */

const writes = {};

function remoteSet(key, entry) {
  if (!col) return;
  // En skrivning åt gången per dokument
  writes[key] = (writes[key] || Promise.resolve())
    .then(() => col.doc(key).set(entry))
    .catch(() => setStatus('Kunde inte spara till molnet. Texten finns kvar i webbläsaren.'));
}

function remoteDelete(key) {
  if (!col) return;
  writes[key] = (writes[key] || Promise.resolve())
    .then(() => col.doc(key).delete())
    .catch(() => {});
}

async function connect() {
  if (!window.claude || !window.claude.use) return;
  const [db, user, dl] = await Promise.all([
    claude.use('db'), claude.use('user'), claude.use('downloads'),
  ]);
  downloads = dl;
  $('export').hidden = !downloads;
  const uid = user ? await user.id() : null;
  if (!db || !uid) return;

  col = db.collection('data/users/' + uid);
  $('where').textContent = 'Sparas privat på ditt konto. Bara du kan läsa dagboken.';

  let first = true;
  col.onSnapshot((snap) => {
    let touched = false;
    for (const ch of snap.docChanges()) {
      const key = ch.doc.id;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
      if (ch.type === 'removed') {
        if (entries[key] && !(saveTimer && key === current)) {
          delete entries[key];
          touched = true;
        }
        continue;
      }
      const remote = clean(ch.doc.data() || {});
      const local = entries[key];
      if (!local || remote.updated > local.updated) {
        entries[key] = remote;
        touched = true;
      }
    }
    if (first) {
      // Dagar som bara finns lokalt, eller är nyare lokalt, laddas upp
      first = false;
      const remoteKeys = new Map(snap.docs.map((d) => [d.id, clean(d.data() || {})]));
      for (const [key, e] of Object.entries(entries)) {
        const r = remoteKeys.get(key);
        if (!r || e.updated > r.updated) remoteSet(key, e);
      }
    }
    if (!touched) return;
    writeCache();
    if (view === 'all') renderList();
    else if (!saveTimer && !$('entry').contains(document.activeElement)) showDay(current);
  }, () => {
    col = null;
    $('where').textContent = 'Anslutningen bröts. Sparas i den här webbläsaren tills sidan laddas om.';
  });
}

/* Dagvy */

function isEmpty(e) {
  return !e.highlight && !e.notes && !e.grateful && !e.tags.length && e.mood == null && e.sleep == null;
}

function readForm() {
  const sleep = parseNumber(fields.sleep.value);
  const checked = moodButtons.find((b) => b.getAttribute('aria-checked') === 'true');
  return {
    highlight: fields.highlight.value.trim(),
    notes: fields.notes.value.trim(),
    grateful: fields.grateful.value.trim(),
    tags: fields.tags.value.split(',').map((t) => t.trim()).filter(Boolean),
    mood: checked ? Number(checked.dataset.v) : null,
    sleep: sleep != null && sleep >= 0 && sleep <= 24 ? sleep : null,
  };
}

function setMood(v) {
  moodButtons.forEach((b) => b.setAttribute('aria-checked', String(Number(b.dataset.v) === v)));
}

function autosize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 2 + 'px';
}

function showDay(key) {
  flushSave();
  const today = todayKey();
  if (key > today) key = today;
  current = key;

  const e = entries[key] || {};
  fields.highlight.value = e.highlight || '';
  fields.notes.value = e.notes || '';
  fields.grateful.value = e.grateful || '';
  fields.tags.value = (e.tags || []).join(', ');
  fields.sleep.value = e.sleep != null ? fmtNumber(e.sleep) : '';
  setMood(e.mood ?? null);

  $('date-label').textContent = fmtDate(key);
  $('date-pick').value = key;
  $('date-pick').max = today;
  $('next').disabled = key >= today;
  $('to-today').hidden = key === today;
  $('confirm').hidden = true;
  $('delete').hidden = !entries[key];
  setStatus(e.updated ? savedText(e.updated) : '');

  requestAnimationFrame(() => { autosize(fields.highlight); autosize(fields.notes); });
}

function savedText(iso) {
  const d = new Date(iso);
  const time = timeFmt.format(d);
  return keyOf(d) === todayKey() ? `Sparad ${time}` : `Sparad ${fmtDate(keyOf(d))}, ${time}`;
}

function setStatus(text) { $('status').textContent = text; }

function save() {
  saveTimer = null;
  const data = readForm();
  if (isEmpty(data)) {
    if (!entries[current]) return;
    delete entries[current];
    writeCache();
    remoteDelete(current);
    setStatus('');
    $('delete').hidden = true;
    return;
  }
  data.updated = new Date().toISOString();
  entries[current] = data;
  writeCache();
  remoteSet(current, data);
  setStatus(savedText(data.updated));
  if ($('confirm').hidden) $('delete').hidden = false;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); save(); }
}

Object.values(fields).forEach((el) => {
  el.addEventListener('input', () => {
    if (el.tagName === 'TEXTAREA') autosize(el);
    scheduleSave();
  });
});

fields.sleep.addEventListener('blur', () => {
  const n = readForm().sleep;
  fields.sleep.value = n != null ? fmtNumber(n) : '';
});

moodButtons.forEach((b) => {
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-checked') === 'true';
    setMood(on ? null : Number(b.dataset.v));
    scheduleSave();
  });
});

$('prev').addEventListener('click', () => showDay(shiftKey(current, -1)));
$('next').addEventListener('click', () => showDay(shiftKey(current, 1)));
$('to-today').addEventListener('click', () => showDay(todayKey()));
$('date-pick').addEventListener('change', (ev) => { if (ev.target.value) showDay(ev.target.value); });

$('delete').addEventListener('click', () => {
  $('delete').hidden = true;
  $('confirm').hidden = false;
});
$('delete-no').addEventListener('click', () => {
  $('confirm').hidden = true;
  $('delete').hidden = false;
});
$('delete-yes').addEventListener('click', () => {
  clearTimeout(saveTimer);
  saveTimer = null;
  delete entries[current];
  writeCache();
  remoteDelete(current);
  showDay(current);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);

/* Listvy */

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function highlightMatch(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  const re = new RegExp(escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return safe.replace(re, (m) => `<mark>${m}</mark>`);
}

function snippet(e, q) {
  const main = e.highlight || e.notes || e.grateful || '';
  if (!q) return main;
  const lq = q.toLowerCase();
  for (const t of [e.highlight, e.notes, e.grateful]) {
    const i = (t || '').toLowerCase().indexOf(lq);
    if (i === -1) continue;
    return i < 60 ? t : '…' + t.slice(i - 30);
  }
  return main;
}

function renderList() {
  const q = $('search').value.trim();
  const lq = q.toLowerCase();
  const keys = Object.keys(entries).sort().reverse().filter((k) => {
    if (!lq) return true;
    const e = entries[k];
    return [e.highlight, e.notes, e.grateful, e.tags.join(' '), fmtDate(k)]
      .some((t) => (t || '').toLowerCase().includes(lq));
  });

  const list = $('list');
  if (!keys.length) {
    list.innerHTML = `<p class="empty">${q ? 'Inga dagar matchar sökningen.' : 'Inget skrivet ännu. Börja på fliken Dag.'}</p>`;
    return;
  }

  const today = todayKey();
  let html = '';
  let month = '';
  for (const k of keys) {
    const e = entries[k];
    const m = monthFmt.format(parseKey(k));
    if (m !== month) {
      month = m;
      html += `<h2 class="month">${m}</h2>`;
    }
    const meta = [];
    if (e.mood != null) meta.push(`Humör ${e.mood}`);
    if (e.sleep != null) meta.push(`Sömn ${fmtNumber(e.sleep)} h`);
    if (e.tags.length) meta.push(e.tags.join(', '));
    html += `<button type="button" class="item${k === today ? ' today' : ''}" data-key="${k}">
      <div class="when">${fmtDate(k)}</div>
      <div class="what">${highlightMatch(snippet(e, q), q)}</div>
      ${meta.length ? `<div class="meta">${highlightMatch(meta.join(', '), q)}</div>` : ''}
    </button>`;
  }
  list.innerHTML = html;
}

$('search').addEventListener('input', renderList);
$('list').addEventListener('click', (ev) => {
  const item = ev.target.closest('.item');
  if (item) { setView('day'); showDay(item.dataset.key); }
});

/* Säkerhetskopia */

function backupMsg(text) { $('backup-msg').textContent = text; }

$('export').addEventListener('click', async () => {
  flushSave();
  try {
    await downloads.save({
      filename: `dagbok-${todayKey()}.json`,
      data: JSON.stringify({ app: 'dagbok', version: 1, entries }, null, 2),
    });
    backupMsg('');
  } catch (err) {
    backupMsg(err && err.code === 'declined' ? '' : 'Filen kunde inte sparas här.');
  }
});

$('import').addEventListener('click', () => $('import-file').click());

$('import-file').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  let incoming;
  try {
    const data = JSON.parse(await file.text());
    incoming = data.entries || data;
    if (!incoming || typeof incoming !== 'object') throw new Error();
  } catch {
    backupMsg('Filen gick inte att läsa. Välj en fil som exporterats från dagboken.');
    return;
  }
  let added = 0;
  let replaced = 0;
  for (const [k, raw] of Object.entries(incoming)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !raw || typeof raw !== 'object') continue;
    const e = clean(raw);
    const old = entries[k];
    if (!old) added++;
    else if (e.updated > old.updated) replaced++;
    else continue;
    entries[k] = e;
    remoteSet(k, e);
  }
  writeCache();
  renderList();
  backupMsg(`Importerade ${added} nya dagar och uppdaterade ${replaced}.`);
});

/* Flikar */

function setView(v) {
  flushSave();
  view = v;
  $('view-day').hidden = v !== 'day';
  $('view-all').hidden = v !== 'all';
  $('tab-day').classList.toggle('on', v === 'day');
  $('tab-all').classList.toggle('on', v === 'all');
  if (v === 'all') renderList();
  window.scrollTo(0, 0);
}

$('tab-day').addEventListener('click', () => { setView('day'); showDay(todayKey()); });
$('tab-all').addEventListener('click', () => setView('all'));

if (location.hash === '#alla') setView('all');
