<title>Dagbok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: en smal skrivspalt, flikar överst, datumet är det största på dagvyn */
:root {
  --bg: #f3f3ef;
  --surface: #fcfcfa;
  --text: #1f2226;
  --muted: #6d7177;
  --line: #dcddd7;
  --accent: #2c4f86;
  --accent-text: #fff;
  --danger: #a33b2b;
  --m1: #d2483c; --m2: #e8893c; --m3: #e2c23d; --m4: #95c65c; --m5: #3d9c5a;
  --on-mood: #1f2226;
  --nav-h: 58px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --surface: #1f2228; --text: #e6e7ea; --muted: #959aa3;
    --line: #2f333a; --accent: #8fb0e6; --accent-text: #16181c; --danger: #e0806f;
    --m1: #e0675b; --m2: #eb9a55; --m3: #e6cb58; --m4: #a5d06f; --m5: #5cb878;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --surface: #1f2228; --text: #e6e7ea; --muted: #959aa3;
  --line: #2f333a; --accent: #8fb0e6; --accent-text: #16181c; --danger: #e0806f;
    --m1: #e0675b; --m2: #eb9a55; --m3: #e6cb58; --m4: #a5d06f; --m5: #5cb878;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--sans);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.wrap { padding-block: 8px calc(var(--nav-h) + 72px); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.daynav { display: flex; align-items: center; gap: 4px; margin: 12px 0 2px; }
.icon {
  width: 40px; height: 40px; flex: none;
  border: 0; background: none; border-radius: 8px; cursor: pointer;
  font-size: 28px; line-height: 1; color: var(--muted);
}
.icon:active { background: var(--line); }
.icon:disabled { opacity: .3; cursor: default; }
.date { position: relative; flex: 1; min-width: 0; }
#date-label {
  display: block;
  font-family: var(--serif);
  font-size: 22px; font-weight: 600; line-height: 1.25;
}
/* Datumväljaren ligger osynlig ovanpå rubriken så att ett tryck öppnar den */
#date-pick { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

.link {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent);
  text-decoration: underline; text-underline-offset: 3px;
}
#to-today { margin-left: 44px; font-size: 14px; display: block; }
.danger { color: var(--danger); }

form { margin-top: 16px; }
.field { display: block; margin: 0 0 18px; padding: 0; border: 0; min-width: 0; }
.field > span, .field > legend {
  display: block; padding: 0; margin-bottom: 4px;
  font-size: 14px; color: var(--muted);
}
input:not([type]), input[type="search"], textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 16px;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--muted); }
textarea {
  resize: none; overflow: hidden;
  font-family: var(--serif); font-size: 17px; line-height: 1.55;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 7px 13px; cursor: pointer;
}
.chips button[aria-checked="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.temp { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.temp input { width: 90px; }
.auto { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.scale { display: flex; gap: 4px; }
.scale button {
  flex: 1; height: 44px; cursor: pointer;
  border: 1px solid transparent; border-radius: 8px;
  background: color-mix(in srgb, var(--m) 22%, var(--surface));
}
.scale button[aria-checked="true"] {
  background: var(--m); color: var(--on-mood); font-weight: 600;
  border-color: color-mix(in srgb, var(--m) 70%, var(--text));
}
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 4px; }
.foot {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: 14px; color: var(--muted); min-height: 20px;
}
.confirm { display: flex; gap: 14px; align-items: baseline; }

#search { margin: 16px 0 4px; }
.month {
  font-size: 14px; font-weight: 400; color: var(--muted);
  margin: 24px 0 0; padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.month::first-letter { text-transform: uppercase; }
.empty { color: var(--muted); margin-top: 24px; }
mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; border-radius: 2px; }

.backup { margin-top: 40px; }
.backup h2 { font-size: 16px; margin: 0 0 2px; }
.muted { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.buttons button {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 9px 14px; cursor: pointer;
}
.buttons button:active { background: var(--line); }
#backup-msg { margin: 10px 0 0; }
/* Kalender */
.cal-head {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 12px 0 4px;
}
#cal-title {
  flex: 1;
  margin: 0;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  text-align: center;
}
#cal-title::first-letter { text-transform: uppercase; }
.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  margin: 4px 0 12px;
  cursor: pointer;
}
.toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.wd {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding-bottom: 2px;
}
.day {
  position: relative;
  aspect-ratio: 1;
  max-height: 64px;
  border: 0;
  border-radius: 8px;
  background: none;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.day:disabled { opacity: .35; cursor: default; }
.day.has { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.day.has::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 6px;
  width: 5px;
  height: 5px;
  margin-left: -2.5px;
  border-radius: 50%;
  background: var(--muted);
}
.moods .day.has[style]::after { display: none; }
.moods .day.has[style] { background: var(--m); color: var(--on-mood); box-shadow: none; }
.day.today { font-weight: 700; }
.day.sel { box-shadow: inset 0 0 0 2px var(--text); }
.moods .day.has[style].sel { box-shadow: inset 0 0 0 2px var(--text); }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
}
.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--m);
  margin-right: 5px;
}
.read {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.read .when { font-size: 14px; color: var(--muted); }
.read .prose { margin: 6px 0 10px; font-size: 18px; }
.read .meta { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
/* Skrivytan: ingen ram, bara text på sidan */
.paper {
  position: relative;
  min-height: 40vh;
  padding: 2px 0 8px;
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.6;
  outline: none;
  overflow-wrap: anywhere;
  -webkit-user-select: text;
  user-select: text;
}
.paper.empty::before {
  content: "Skriv om dagen";
  position: absolute;
  top: 2px;
  left: 0;
  color: var(--muted);
  opacity: .7;
  pointer-events: none;
}
.paper p, .prose p { margin: 0; }
.paper h2, .prose h2 {
  font-size: 1.3em;
  line-height: 1.3;
  font-weight: 600;
  margin: .7em 0 .2em;
}
.paper h3, .prose h3 {
  font-size: 1.08em;
  line-height: 1.35;
  font-weight: 600;
  margin: .6em 0 .1em;
}
.paper > :first-child, .prose > :first-child { margin-top: 0; }
.paper ul, .paper ol, .prose ul, .prose ol { margin: .2em 0; padding-left: 1.3em; }
.paper li, .prose li { padding-left: .15em; }
.paper strong, .prose strong { font-weight: 700; }

.prose {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

/* Formateringsrad, syns bara när man skriver */
.fmt {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  z-index: 6;
  display: none;
  gap: 4px;
  padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px), calc((100% - 640px) / 2 + 8px));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
body.editing .fmt { display: flex; }
body.keyboard .fmt { bottom: 0; }
body.keyboard .nav { visibility: hidden; }
.fmt button {
  min-width: 44px;
  height: 36px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
}
.fmt button b, .fmt button i { font-family: var(--serif); font-size: 17px; }
.fmt button[aria-pressed="true"] { background: var(--line); color: var(--text); }

/* Bottenmeny */
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.nav a, .nav button {
  flex: 1;
  max-width: 160px;
  height: var(--nav-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: 0;
  background: none;
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
  cursor: pointer;
}
.nav svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav .on { color: var(--accent); }

/* Flöde */
.post {
  padding: 16px 0 18px;
  border-bottom: 1px solid var(--line);
}
.post-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 6px;
}
.post .when { font-size: 14px; color: var(--muted); }
.post.today .when { color: var(--accent); }
.post .open { font-size: 14px; flex: none; }
.post .meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
</style>


<main class="wrap">
  <section id="view-day">
    <div class="daynav">
      <button type="button" class="icon" id="prev" aria-label="Föregående dag">&#8249;</button>
      <label class="date">
        <span id="date-label"></span>
        <input type="date" id="date-pick" aria-label="Välj datum">
      </label>
      <button type="button" class="icon" id="next" aria-label="Nästa dag">&#8250;</button>
    </div>
    <button type="button" class="link" id="to-today" hidden>Gå till idag</button>

    <form id="entry" autocomplete="off">
      <div class="field">
        <span id="text-label">Vad som hänt idag</span>
        <div id="f-text" class="paper" contenteditable="true" role="textbox" aria-multiline="true"
          aria-labelledby="text-label" spellcheck="true"></div>
      </div>
      <fieldset class="field">
        <legend>Humör</legend>
        <div class="scale" id="f-mood" role="radiogroup">
          <button type="button" role="radio" data-v="1" style="--m: var(--m1)" aria-label="1, tungt">1</button>
          <button type="button" role="radio" data-v="2" style="--m: var(--m2)">2</button>
          <button type="button" role="radio" data-v="3" style="--m: var(--m3)">3</button>
          <button type="button" role="radio" data-v="4" style="--m: var(--m4)">4</button>
          <button type="button" role="radio" data-v="5" style="--m: var(--m5)" aria-label="5, bra">5</button>
        </div>
        <div class="ends"><span>Tungt</span><span>Bra</span></div>
      </fieldset>
      <fieldset class="field">
        <legend>Väder</legend>
        <div class="chips" id="f-weather" role="radiogroup">
          <button type="button" role="radio" data-code="0">Sol</button>
          <button type="button" role="radio" data-code="2">Halvklart</button>
          <button type="button" role="radio" data-code="3">Mulet</button>
          <button type="button" role="radio" data-code="63">Regn</button>
          <button type="button" role="radio" data-code="73">Snö</button>
          <button type="button" role="radio" data-code="95">Åska</button>
          <button type="button" role="radio" data-code="45">Dimma</button>
        </div>
        <label class="temp">
          <input id="f-temp" inputmode="decimal" placeholder="12" aria-label="Temperatur i grader">

        </label>
        <p class="auto" id="weather-auto" hidden></p>
      </fieldset>
    </form>

    <div class="foot">
      <span id="status" aria-live="polite"></span>
      <button type="button" class="link danger" id="delete" hidden>Ta bort dagen</button>
      <span class="confirm" id="confirm" hidden>
        <button type="button" class="link danger" id="delete-yes">Ta bort</button>
        <button type="button" class="link" id="delete-no">Avbryt</button>
      </span>
    </div>
  </section>

  <section id="view-cal" hidden>
    <div class="cal-head">
      <button type="button" class="icon" id="cal-prev" aria-label="Föregående månad">&#8249;</button>
      <h2 id="cal-title"></h2>
      <button type="button" class="icon" id="cal-next" aria-label="Nästa månad">&#8250;</button>
    </div>
    <label class="toggle">
      <input type="checkbox" id="mood-filter">
      <span>Visa humör</span>
    </label>
    <div class="grid" id="cal-grid"></div>
    <div class="legend" id="legend" hidden>
      <span><i style="--m: var(--m1)"></i>1 tungt</span>
      <span><i style="--m: var(--m2)"></i>2</span>
      <span><i style="--m: var(--m3)"></i>3</span>
      <span><i style="--m: var(--m4)"></i>4</span>
      <span><i style="--m: var(--m5)"></i>5 bra</span>
    </div>
    <div class="read" id="cal-entry"></div>
  </section>

  <section id="view-all" hidden>
    <input type="search" id="search" placeholder="Sök i dagboken" aria-label="Sök">
    <div id="list"></div>

    <div class="backup">
      <h2>Säkerhetskopia</h2>
      <p class="muted" id="where">Sparas i den här webbläsaren.</p>
      <div class="buttons">
        <button type="button" id="export" hidden>Exportera fil</button>
        <button type="button" id="import">Importera fil</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <p class="muted" id="backup-msg" aria-live="polite"></p>
    </div>
  </section>
</main>

<div class="fmt" id="fmt" role="toolbar" aria-label="Formatering">
  <button type="button" data-cmd="bold" aria-label="Fet"><b>B</b></button>
  <button type="button" data-cmd="italic" aria-label="Kursiv"><i>K</i></button>

</div>

<nav class="nav" aria-label="Vyer">
  <button type="button" id="tab-day" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>
    <span>Dag</span>
  </button>
  <button type="button" id="tab-cal">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Kalender</span>
  </button>
  <button type="button" id="tab-all">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg>
    <span>Flöde</span>
  </button>
</nav>

<script>
'use strict';

// Skrivytan. Texten sparas som Markdown: # och ## för rubriker, - och 1. för listor,
// **fet** och *kursiv*. Varje rad blir ett eget stycke.
const Paper = (() => {
  function esc(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function inline(s) {
    return esc(s)
      .replace(/\*\*(?=\S)(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*(?=[^\s*])([^*]+?)\*(?!\*)/g, '$1<em>$2</em>');
  }

  function mdToHtml(md) {
    const lines = String(md || '').replace(/\r/g, '').split('\n');
    let html = '';
    let list = null;
    const close = () => {
      if (list) html += `</${list}>`;
      list = null;
    };
    const item = (tag, text) => {
      if (list !== tag) {
        close();
        html += `<${tag}>`;
        list = tag;
      }
      html += `<li>${inline(text) || '<br>'}</li>`;
    };
    for (const line of lines) {
      let m;
      if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { item('ul', m[1]); continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { item('ol', m[1]); continue; }
      close();
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
        const tag = m[1].length === 1 ? 'h2' : 'h3';
        html += `<${tag}>${inline(m[2]) || '<br>'}</${tag}>`;
      } else {
        html += line.trim() ? `<p>${inline(line)}</p>` : '<p><br></p>';
      }
    }
    close();
    return html;
  }

  // Ren text utan Markdown-tecken, för sökning och korta utdrag.
  function mdToText(md) {
    return String(md || '').split('\n')
      .map((l) => l.replace(/^(#{1,6}|\s*[-*+]|\s*\d+[.)])\s+/, ''))
      .join('\n')
      .replace(/\*\*(?=\S)(.+?)\*\*/g, '$1')
      .replace(/(^|[^*])\*(?=[^\s*])([^*]+?)\*(?!\*)/g, '$1$2');
  }

  /* Från redigeraren tillbaka till Markdown */

  function wrap(s, mark) {
    if (!s.trim()) return s;
    const lead = s.match(/^\s*/)[0];
    const tail = s.match(/\s*$/)[0];
    return lead + mark + s.trim() + mark + tail;
  }

  function inlineMd(node) {
    let out = '';
    for (const n of node.childNodes) {
      if (n.nodeType === 3) {
        out += n.data.replace(/​/g, '').replace(/ /g, ' ');
      } else if (n.nodeType === 1) {
        const t = n.tagName;
        if (t === 'BR') out += '\n';
        else if (t === 'STRONG' || t === 'B') out += wrap(inlineMd(n), '**');
        else if (t === 'EM' || t === 'I') out += wrap(inlineMd(n), '*');
        else if (t !== 'UL' && t !== 'OL') out += inlineMd(n);
      }
    }
    return out;
  }

  const oneLine = (n) => inlineMd(n).replace(/\n+/g, ' ').trim();
  const BLOCK = /^(P|DIV|H[1-6]|UL|OL|BLOCKQUOTE|PRE)$/;

  function htmlToLines(root) {
    const lines = [];
    let loose = [];
    const para = (el) => {
      inlineMd(el).replace(/\n$/, '').split('\n').forEach((l) => lines.push(l));
    };
    const flush = () => {
      if (!loose.length) return;
      const p = document.createElement('p');
      loose.forEach((n) => p.appendChild(n.cloneNode(true)));
      para(p);
      loose = [];
    };
    for (const n of root.childNodes) {
      if (n.nodeType !== 1 || !BLOCK.test(n.tagName)) {
        loose.push(n);
        continue;
      }
      flush();
      const t = n.tagName;
      if (t === 'H1' || t === 'H2') {
        lines.push('# ' + oneLine(n));
      } else if (/^H[3-6]$/.test(t)) {
        lines.push('## ' + oneLine(n));
      } else if (t === 'UL' || t === 'OL') {
        let i = 1;
        for (const li of n.querySelectorAll('li')) {
          lines.push((t === 'UL' ? '- ' : `${i++}. `) + oneLine(li));
        }
      } else if ([...n.children].some((c) => BLOCK.test(c.tagName))) {
        lines.push(...htmlToLines(n));
      } else {
        para(n);
      }
    }
    flush();
    return lines;
  }

  function htmlToMd(root) {
    const lines = htmlToLines(root);
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    return lines.join('\n');
  }

  /* Redigeraren */

  function createEditor(el, bar, onChange) {
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch {}
    const exec = (cmd, value) => document.execCommand(cmd, false, value);
    const sel = () => window.getSelection();

    // Stycket där markören står, närmast under redigeraren
    function block() {
      const s = sel();
      if (!s.rangeCount) return null;
      let n = s.anchorNode;
      while (n && n.parentNode !== el) n = n.parentNode;
      return n && n.nodeType === 1 ? n : null;
    }

    function inside(tag) {
      let n = sel().anchorNode;
      while (n && n !== el) {
        if (n.nodeName === tag) return true;
        n = n.parentNode;
      }
      return false;
    }

    function caretAtStart(b) {
      const s = sel();
      if (!s.rangeCount) return false;
      const r = document.createRange();
      r.setStart(b, 0);
      r.setEnd(s.anchorNode, s.anchorOffset);
      return r.toString().replace(/​/g, '') === '';
    }

    function setCaret(node, offset) {
      const r = document.createRange();
      r.setStart(node, offset);
      r.collapse(true);
      sel().removeAllRanges();
      sel().addRange(r);
    }

    function firstText(n) {
      const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT);
      return w.nextNode();
    }

    // Gör stycket till en lista, eller lägger det sist i listan ovanför
    function makeList(b, tag) {
      const prev = b.previousElementSibling;
      const list = prev && prev.tagName === tag.toUpperCase() ? prev : document.createElement(tag);
      const li = document.createElement('li');
      while (b.firstChild) li.appendChild(b.firstChild);
      if (!li.firstChild) li.innerHTML = '<br>';
      list.appendChild(li);
      if (list === prev) b.remove();
      else b.replaceWith(list);
      const t = firstText(li);
      if (t) setCaret(t, 0);
      else setCaret(li, 0);
      el.dispatchEvent(new InputEvent('input', { inputType: 'formatBlock' }));
    }

    // "# ", "## ", "- " och "1. " i början av en rad
    function blockShortcut() {
      const s = sel();
      const node = s.anchorNode;
      if (!node || node.nodeType !== 3) return false;
      const b = block();
      if (!b || !/^(P|DIV)$/.test(b.tagName) || firstText(b) !== node) return false;
      const pre = node.data.slice(0, s.anchorOffset);
      const m = pre.match(/^(##?|[-*+]|1[.)])[  ]$/);
      if (!m) return false;
      node.data = node.data.slice(pre.length);
      // En tom textnod förvirrar webbläsaren, så tomma rader får en radbrytning
      if (!b.textContent) {
        b.innerHTML = '<br>';
        setCaret(b, 0);
      } else {
        setCaret(node, 0);
      }
      if (m[1] === '#') exec('formatBlock', 'h2');
      else if (m[1] === '##') exec('formatBlock', 'h3');
      else makeList(b, /^1/.test(m[1]) ? 'ol' : 'ul');
      return true;
    }

    // **fet** och *kursiv* när den avslutande stjärnan skrivs
    function inlineShortcut() {
      const s = sel();
      const node = s.anchorNode;
      if (!node || node.nodeType !== 3) return false;
      const pre = node.data.slice(0, s.anchorOffset);
      let tag = 'strong';
      let m = pre.match(/\*\*([^*\s](?:[^*]*[^*\s])?)\*\*$/);
      if (!m) {
        tag = 'em';
        m = pre.match(/(?:^|[^*])\*([^*\s](?:[^*]*[^*\s])?)\*$/);
      }
      if (!m) return false;
      const inner = m[1];
      const start = pre.length - inner.length - (tag === 'strong' ? 4 : 2);
      node.splitText(s.anchorOffset);
      const marked = node.splitText(start);
      const w = document.createElement(tag);
      w.textContent = inner;
      marked.replaceWith(w);
      // Ett osynligt tecken efter så att man fortsätter skriva utan formatering
      const gap = document.createTextNode('​');
      w.after(gap);
      setCaret(gap, 1);
      return true;
    }

    function ensureBlocks() {
      if (!el.firstChild || (el.childNodes.length === 1 && el.firstChild.nodeName === 'BR')) {
        el.innerHTML = '<p><br></p>';
        setCaret(el.firstChild, 0);
      } else if (el.firstChild.nodeType === 3) {
        exec('formatBlock', 'p');
      }
    }

    function markEmpty() {
      el.classList.toggle('empty', !el.textContent.replace(/​/g, '').trim() &&
        !el.querySelector('li, h2, h3'));
    }

    function updateBar() {
      if (!bar) return;
      for (const b of bar.querySelectorAll('button')) {
        const c = b.dataset.cmd;
        let on = false;
        try {
          // Rubriker är feta i sig och räknas inte som fetstil
          if (c === 'bold') on = document.queryCommandState(c) && !/^H/.test((block() || {}).tagName);
          else if (c === 'italic') on = document.queryCommandState(c);
          else if (c === 'h2') on = /^H[23]$/.test((block() || {}).tagName);
          else if (c === 'ul') on = inside('UL');
        } catch {}
        b.setAttribute('aria-pressed', String(on));
      }
    }

    const changed = () => {
      markEmpty();
      updateBar();
      onChange();
    };

    el.addEventListener('input', (ev) => {
      if (ev.inputType === 'insertText' && ev.data) {
        if (/^[  ]$/.test(ev.data)) blockShortcut();
        else if (ev.data === '*') inlineShortcut();
      }
      ensureBlocks();
      changed();
    });

    el.addEventListener('keydown', (ev) => {
      const mod = (ev.metaKey || ev.ctrlKey) && !ev.altKey;
      if (mod && /^[bi]$/i.test(ev.key)) {
        ev.preventDefault();
        exec(ev.key.toLowerCase() === 'b' ? 'bold' : 'italic');
        changed();
        return;
      }
      if (ev.key === 'Backspace' && sel().isCollapsed) {
        // Backsteg först i en rubrik gör den till vanlig text igen
        const b = block();
        if (b && /^H[1-6]$/.test(b.tagName) && caretAtStart(b)) {
          ev.preventDefault();
          exec('formatBlock', 'p');
          changed();
        }
      }
    });

    el.addEventListener('paste', (ev) => {
      ev.preventDefault();
      const text = (ev.clipboardData || window.clipboardData).getData('text/plain');
      if (/\n/.test(text)) exec('insertHTML', mdToHtml(text));
      else exec('insertText', text);
    });

    if (bar) {
      // Knapparna får inte ta fokus från texten
      const keep = (ev) => { if (ev.target.closest('button')) ev.preventDefault(); };
      bar.addEventListener('pointerdown', keep);
      bar.addEventListener('mousedown', keep);
      bar.addEventListener('click', (ev) => {
        const btn = ev.target.closest('button');
        if (!btn) return;
        if (document.activeElement !== el) el.focus();
        const c = btn.dataset.cmd;
        if (c === 'h2') {
          exec('formatBlock', /^H[23]$/.test((block() || {}).tagName) ? 'p' : 'h2');
        } else if (c === 'ul') {
          exec('insertUnorderedList');
        } else {
          exec(c);
        }
        changed();
      });
    }

    document.addEventListener('selectionchange', () => {
      if (document.activeElement === el) updateBar();
    });

    // Verktygsraden följer med tangentbordet på telefonen
    function place() {
      const vv = window.visualViewport;
      if (!vv || !bar) return;
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      const open = kb > 80;
      document.body.classList.toggle('keyboard', open);
      bar.style.transform = open ? `translateY(${-kb}px)` : '';
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', place);
      window.visualViewport.addEventListener('scroll', place);
    }

    el.addEventListener('focus', () => {
      document.body.classList.add('editing');
      place();
      updateBar();
    });
    el.addEventListener('blur', () => document.body.classList.remove('editing', 'keyboard'));

    return {
      get: () => htmlToMd(el).replace(/\s+$/, ''),
      set(md) {
        el.innerHTML = mdToHtml(md) || '<p><br></p>';
        markEmpty();
      },
      focused: () => document.activeElement === el,
    };
  }

  // Markerar sökträffar i redan renderad text
  function highlight(root, q) {
    if (!q) return;
    const lq = q.toLowerCase();
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const hits = [];
    let n;
    while ((n = w.nextNode())) if (n.data.toLowerCase().includes(lq)) hits.push(n);
    for (const t of hits) {
      const frag = document.createDocumentFragment();
      let rest = t.data;
      let i;
      while ((i = rest.toLowerCase().indexOf(lq)) !== -1) {
        frag.append(rest.slice(0, i));
        const mark = document.createElement('mark');
        mark.textContent = rest.slice(i, i + q.length);
        frag.append(mark);
        rest = rest.slice(i + q.length);
      }
      frag.append(rest);
      t.replaceWith(frag);
    }
  }

  return { mdToHtml, mdToText, createEditor, highlight };
})();


const CACHE_KEY = 'dagbok.v1';
const $ = (id) => document.getElementById(id);

const editor = Paper.createEditor($('f-text'), $('fmt'), () => scheduleSave());
const tempField = $('f-temp');
const weatherButtons = [...$('f-weather').querySelectorAll('button')];
const moodButtons = [...$('f-mood').querySelectorAll('button')];

let entries = normalizeAll(loadCache());
let current = todayKey();
let view = 'day';
let saveTimer = null;
let col = null;       // dagbokens samling i databasen, om den finns
let downloads = null;

/* Lokal kopia, används direkt vid start och om databasen saknas */

function loadCache() {
  try {
    const data = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    return data && typeof data === 'object' ? data : {};
  } catch {
    return {};
  }
}

function writeCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(entries)); } catch {}
}

/* Datum och tal */

function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayKey() { return keyOf(new Date()); }

function parseKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function shiftKey(key, days) {
  const d = parseKey(key);
  d.setDate(d.getDate() + days);
  return keyOf(d);
}

const dateFmt = new Intl.DateTimeFormat('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const monthFmt = new Intl.DateTimeFormat('sv-SE', { month: 'long', year: 'numeric' });
const timeFmt = new Intl.DateTimeFormat('sv-SE', { hour: '2-digit', minute: '2-digit', hour12: false });

const fmtDate = (key) => dateFmt.format(parseKey(key));
const WEATHER_TEXT = {
  0: 'Klart', 1: 'Mest klart', 2: 'Halvklart', 3: 'Mulet',
  45: 'Dimma', 48: 'Dimma med rimfrost',
  51: 'Lätt duggregn', 53: 'Duggregn', 55: 'Kraftigt duggregn',
  56: 'Underkylt duggregn', 57: 'Underkylt duggregn',
  61: 'Lätt regn', 63: 'Regn', 65: 'Kraftigt regn',
  66: 'Underkylt regn', 67: 'Underkylt regn',
  71: 'Lätt snöfall', 73: 'Snöfall', 75: 'Kraftigt snöfall', 77: 'Snökorn',
  80: 'Lätta regnskurar', 81: 'Regnskurar', 82: 'Kraftiga regnskurar',
  85: 'Snöbyar', 86: 'Kraftiga snöbyar',
  95: 'Åska', 96: 'Åska med hagel', 99: 'Åska med hagel',
};

// Knapparna samlar väderkoderna i grupper. Koden på knappen är gruppens första.
const WEATHER_GROUPS = [
  [0, [0, 1]], [2, [2]], [3, [3]],
  [63, [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82]],
  [73, [71, 73, 75, 77, 85, 86]], [95, [95, 96, 99]], [45, [45, 48]],
];
const groupOf = (code) => (WEATHER_GROUPS.find(([, codes]) => codes.includes(code)) || [null])[0];

function fmtWeather(w) {
  const parts = [];
  if (w.code != null) parts.push(w.code === 0 ? 'Sol' : WEATHER_TEXT[w.code] || 'Okänt väder');
  if (w.temp != null) parts.push(`${String(Math.round(w.temp)).replace('-', '\u2212')}\u00a0°C`);
  return parts.join(', ') + (w.time ? ` kl ${w.time}` : '');
}

// Gör om ett inlägg till dagens format. Äldre inlägg hade två textfält.
// Vädret väljs här eller hämtas av telefonappen och följer med vid import.
function clean(e) {
  const text = typeof e.text === 'string'
    ? e.text
    : [e.highlight, e.notes].filter(Boolean).map(String).join('\n\n');
  const w = e.weather;
  return {
    text,
    mood: Number.isInteger(e.mood) && e.mood >= 1 && e.mood <= 5 ? e.mood : null,
    weather: w && (typeof w.code === 'number' || typeof w.temp === 'number')
      ? {
        code: typeof w.code === 'number' ? w.code : null,
        temp: typeof w.temp === 'number' ? w.temp : null,
        time: typeof w.time === 'string' ? w.time : null,
      }
      : null,
    updated: typeof e.updated === 'string' ? e.updated : new Date().toISOString(),
  };
}

function normalizeAll(data) {
  const out = {};
  for (const [k, e] of Object.entries(data)) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && e && typeof e === 'object') out[k] = clean(e);
  }
  return out;
}

/* Databasen. Varje dag är ett eget dokument i en privat samling per person. */

const writes = {};

function remoteSet(key, entry) {
  if (!col) return;
  // En skrivning åt gången per dokument
  writes[key] = (writes[key] || Promise.resolve())
    .then(() => col.doc(key).set(entry))
    .catch(() => setStatus('Kunde inte spara till molnet. Texten finns kvar i webbläsaren.'));
}

function remoteDelete(key) {
  if (!col) return;
  writes[key] = (writes[key] || Promise.resolve())
    .then(() => col.doc(key).delete())
    .catch(() => {});
}

async function connect() {
  if (!window.claude || !window.claude.use) return;
  const [db, user, dl] = await Promise.all([
    claude.use('db'), claude.use('user'), claude.use('downloads'),
  ]);
  downloads = dl;
  $('export').hidden = !downloads;
  const uid = user ? await user.id() : null;
  if (!db || !uid) return;

  col = db.collection('data/users/' + uid);
  $('where').textContent = 'Sparas privat på ditt konto. Bara du kan läsa dagboken.';

  let first = true;
  col.onSnapshot((snap) => {
    let touched = false;
    for (const ch of snap.docChanges()) {
      const key = ch.doc.id;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
      if (ch.type === 'removed') {
        if (entries[key] && !(saveTimer && key === current)) {
          delete entries[key];
          touched = true;
        }
        continue;
      }
      const remote = clean(ch.doc.data() || {});
      const local = entries[key];
      if (!local || remote.updated > local.updated) {
        entries[key] = remote;
        touched = true;
      }
    }
    if (first) {
      // Dagar som bara finns lokalt, eller är nyare lokalt, laddas upp
      first = false;
      const remoteKeys = new Map(snap.docs.map((d) => [d.id, clean(d.data() || {})]));
      for (const [key, e] of Object.entries(entries)) {
        const r = remoteKeys.get(key);
        if (!r || e.updated > r.updated) remoteSet(key, e);
      }
    }
    if (!touched) return;
    writeCache();
    if (view === 'all') renderList();
    else if (view === 'cal') renderCal();
    else if (!saveTimer && !$('entry').contains(document.activeElement)) showDay(current);
  }, () => {
    col = null;
    $('where').textContent = 'Anslutningen bröts. Sparas i den här webbläsaren tills sidan laddas om.';
  });
}

/* Dagvy */

function parseTemp(str) {
  const n = parseFloat(String(str).replace(/[\u2212\u2013]/g, '-').replace(',', '.').replace(/\s/g, ''));
  return Number.isFinite(n) && n > -80 && n < 60 ? n : null;
}

function readWeather(old) {
  const chip = weatherButtons.find((b) => b.getAttribute('aria-checked') === 'true');
  const temp = parseTemp(tempField.value);
  if (!chip && temp == null) return null;
  const code = chip ? Number(chip.dataset.code) : null;
  // Oförändrat val behåller det hämtade vädret med klockslag och exakt kod
  if (old && groupOf(old.code) === code &&
      (old.temp == null ? temp == null : temp != null && Math.round(old.temp) === Math.round(temp))) {
    return old;
  }
  return { code, temp, time: null };
}

function readForm() {
  const checked = moodButtons.find((b) => b.getAttribute('aria-checked') === 'true');
  const old = entries[current];
  return {
    text: editor.get(),
    mood: checked ? Number(checked.dataset.v) : null,
    weather: readWeather(old && old.weather),
  };
}

function setMood(v) {
  moodButtons.forEach((b) => b.setAttribute('aria-checked', String(Number(b.dataset.v) === v)));
}

function setWeatherChip(code) {
  weatherButtons.forEach((b) => b.setAttribute('aria-checked', String(Number(b.dataset.code) === code)));
}

function showWeather(e) {
  const w = e && e.weather;
  setWeatherChip(w ? groupOf(w.code) : null);
  tempField.value = w && w.temp != null ? String(Math.round(w.temp)).replace('-', '\u2212') : '';
  // Hämtat väder från telefonappen visas med sin exakta text
  const auto = w && w.time;
  $('weather-auto').hidden = !auto;
  $('weather-auto').textContent = auto ? `Hämtat: ${fmtWeather(w)}` : '';
}

function showDay(key) {
  flushSave();
  const today = todayKey();
  if (key > today) key = today;
  current = key;

  const e = entries[key];
  editor.set(e ? e.text : '');
  setMood(e ? e.mood : null);
  showWeather(e);

  $('date-label').textContent = fmtDate(key);
  $('date-pick').value = key;
  $('date-pick').max = today;
  $('next').disabled = key >= today;
  $('to-today').hidden = key === today;
  $('text-label').textContent = key === today ? 'Vad som hänt idag' : 'Vad som hände';
  $('confirm').hidden = true;
  $('delete').hidden = !entries[key];
  setStatus(e ? savedText(e.updated) : '');
}

function savedText(iso) {
  const d = new Date(iso);
  const time = timeFmt.format(d);
  return keyOf(d) === todayKey() ? `Sparad ${time}` : `Sparad ${fmtDate(keyOf(d))}, ${time}`;
}

function setStatus(text) { $('status').textContent = text; }

function save() {
  saveTimer = null;
  const data = readForm();
  if (!data.text && data.mood == null && !data.weather) {
    if (!entries[current]) return;
    delete entries[current];
    writeCache();
    remoteDelete(current);
    $('weather-auto').hidden = true;
    setStatus('');
    $('delete').hidden = true;
    return;
  }
  data.updated = new Date().toISOString();
  entries[current] = data;
  writeCache();
  remoteSet(current, data);
  setStatus(savedText(data.updated));
  $('weather-auto').hidden = !(data.weather && data.weather.time);
  if ($('confirm').hidden) $('delete').hidden = false;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

function flushSave() {
  if (saveTimer) { clearTimeout(saveTimer); save(); }
}

moodButtons.forEach((b) => {
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-checked') === 'true';
    setMood(on ? null : Number(b.dataset.v));
    scheduleSave();
  });
});

weatherButtons.forEach((b) => {
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-checked') === 'true';
    setWeatherChip(on ? null : Number(b.dataset.code));
    scheduleSave();
  });
});

tempField.addEventListener('input', scheduleSave);
tempField.addEventListener('blur', () => {
  const n = parseTemp(tempField.value);
  tempField.value = n != null ? String(Math.round(n)).replace('-', '\u2212') : '';
});

$('prev').addEventListener('click', () => showDay(shiftKey(current, -1)));
$('next').addEventListener('click', () => showDay(shiftKey(current, 1)));
$('to-today').addEventListener('click', () => showDay(todayKey()));
$('date-pick').addEventListener('change', (ev) => { if (ev.target.value) showDay(ev.target.value); });

$('delete').addEventListener('click', () => {
  $('delete').hidden = true;
  $('confirm').hidden = false;
});
$('delete-no').addEventListener('click', () => {
  $('confirm').hidden = true;
  $('delete').hidden = false;
});
$('delete-yes').addEventListener('click', () => {
  clearTimeout(saveTimer);
  saveTimer = null;
  delete entries[current];
  writeCache();
  remoteDelete(current);
  showDay(current);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});
window.addEventListener('pagehide', flushSave);

/* Flöde */

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderList() {
  const q = $('search').value.trim();
  const lq = q.toLowerCase();
  const keys = Object.keys(entries).sort().reverse().filter((k) => {
    if (!lq) return true;
    const e = entries[k];
    return [Paper.mdToText(e.text), fmtDate(k), e.weather ? fmtWeather(e.weather) : '']
      .some((t) => t.toLowerCase().includes(lq));
  });

  const list = $('list');
  if (!keys.length) {
    list.innerHTML = `<p class="empty">${
      q ? 'Inga dagar matchar sökningen.' : 'Inget skrivet ännu.'
    }</p>`;
    return;
  }

  const today = todayKey();
  let html = '';
  let month = '';
  for (const k of keys) {
    const e = entries[k];
    const m = monthFmt.format(parseKey(k));
    if (m !== month) {
      month = m;
      html += `<h2 class="month">${m}</h2>`;
    }
    const dot = e.mood ? `<span class="dot" style="--m: var(--m${e.mood})" title="Humör ${e.mood}"></span>` : '';
    html += `<article class="post${k === today ? ' today' : ''}">
      <div class="post-head">
        <span class="when">${dot}${fmtDate(k)}</span>
        <button type="button" class="link open" data-key="${k}">Redigera</button>
      </div>
      ${e.text ? `<div class="prose">${Paper.mdToHtml(e.text)}</div>` : ''}
      ${e.weather ? `<div class="meta">${escapeHtml(fmtWeather(e.weather))}</div>` : ''}
    </article>`;
  }
  list.innerHTML = html;
  if (q) list.querySelectorAll('.when, .prose, .meta').forEach((el) => Paper.highlight(el, q));
}

$('search').addEventListener('input', renderList);
$('list').addEventListener('click', (ev) => {
  const item = ev.target.closest('.open');
  if (item) { setView('day'); showDay(item.dataset.key); }
});

/* Kalender */

const FILTER_KEY = 'dagbok.humorfilter';
let calMonth = todayKey().slice(0, 7);
let calSel = todayKey();

try { $('mood-filter').checked = localStorage.getItem(FILTER_KEY) === '1'; } catch {}

function renderCal() {
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const days = new Date(y, m, 0).getDate();
  const today = todayKey();
  const moods = $('mood-filter').checked;

  $('cal-title').textContent = monthFmt.format(first);
  $('cal-next').disabled = calMonth >= today.slice(0, 7);
  $('cal-grid').classList.toggle('moods', moods);
  $('legend').hidden = !moods;

  let html = ['mån', 'tis', 'ons', 'tor', 'fre', 'lör', 'sön']
    .map((d) => `<div class="wd">${d}</div>`).join('');
  // Veckan börjar på måndag
  const offset = (first.getDay() + 6) % 7;
  html += '<div></div>'.repeat(offset);
  for (let d = 1; d <= days; d++) {
    const key = `${calMonth}-${pad(d)}`;
    const e = entries[key];
    const cls = ['day'];
    if (e) cls.push('has');
    if (key === today) cls.push('today');
    if (key === calSel) cls.push('sel');
    const style = e && e.mood ? ` style="--m: var(--m${e.mood})"` : '';
    const label = fmtDate(key) + (e && e.mood ? `, humör ${e.mood}` : e ? ', skrivet' : '');
    html += `<button type="button" class="${cls.join(' ')}" data-key="${key}"${style}
      aria-label="${label}"${key > today ? ' disabled' : ''}>${d}</button>`;
  }
  $('cal-grid').innerHTML = html;
  renderCalEntry();
}

function renderCalEntry() {
  const e = entries[calSel];
  const box = $('cal-entry');
  if (calSel.slice(0, 7) !== calMonth) {
    box.innerHTML = '';
    return;
  }
  if (!e) {
    box.innerHTML = `<div class="when">${fmtDate(calSel)}</div>
      <p class="meta">Inget skrivet den här dagen.</p>
      <button type="button" class="link" id="cal-open">Skriv för den här dagen</button>`;
    return;
  }
  const meta = [];
  if (e.mood) meta.push(`<span class="dot" style="--m: var(--m${e.mood})"></span>Humör ${e.mood}`);
  if (e.weather) meta.push(escapeHtml(fmtWeather(e.weather)));
  box.innerHTML = `<div class="when">${fmtDate(calSel)}</div>
    ${e.text ? `<div class="prose">${Paper.mdToHtml(e.text)}</div>` : ''}
    ${meta.length ? `<div class="meta">${meta.join(', ')}</div>` : ''}
    <button type="button" class="link" id="cal-open">Redigera dagen</button>`;
}

function shiftMonth(n) {
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  renderCal();
}

$('cal-prev').addEventListener('click', () => shiftMonth(-1));
$('cal-next').addEventListener('click', () => shiftMonth(1));
$('mood-filter').addEventListener('change', () => {
  try { localStorage.setItem(FILTER_KEY, $('mood-filter').checked ? '1' : '0'); } catch {}
  renderCal();
});
$('cal-grid').addEventListener('click', (ev) => {
  const btn = ev.target.closest('.day');
  if (!btn || btn.disabled) return;
  calSel = btn.dataset.key;
  renderCal();
});
$('cal-entry').addEventListener('click', (ev) => {
  if (ev.target.id === 'cal-open') openDay(calSel);
});

function openDay(key) { setView('day'); showDay(key); }

/* Säkerhetskopia */

function backupMsg(text) { $('backup-msg').textContent = text; }

$('export').addEventListener('click', async () => {
  flushSave();
  try {
    await downloads.save({
      filename: `dagbok-${todayKey()}.json`,
      data: JSON.stringify({ app: 'dagbok', version: 2, entries }, null, 2),
    });
    backupMsg('');
  } catch (err) {
    backupMsg(err && err.code === 'declined' ? '' : 'Filen kunde inte sparas här.');
  }
});

$('import').addEventListener('click', () => $('import-file').click());

$('import-file').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  let incoming;
  try {
    const data = JSON.parse(await file.text());
    incoming = data.entries || data;
    if (!incoming || typeof incoming !== 'object') throw new Error();
  } catch {
    backupMsg('Filen gick inte att läsa. Välj en fil som exporterats från dagboken.');
    return;
  }
  let added = 0;
  let replaced = 0;
  for (const [k, raw] of Object.entries(incoming)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !raw || typeof raw !== 'object') continue;
    const e = clean(raw);
    const old = entries[k];
    if (!old) added++;
    else if (e.updated > old.updated) replaced++;
    else continue;
    entries[k] = e;
    remoteSet(k, e);
  }
  writeCache();
  renderList();
  backupMsg(`Importerade ${added} nya dagar och uppdaterade ${replaced}.`);
});

/* Flikar */

function setView(v) {
  flushSave();
  view = v;
  for (const name of ['day', 'cal', 'all']) {
    $(`view-${name}`).hidden = name !== v;
    $(`tab-${name}`).classList.toggle('on', name === v);
  }
  if (v === 'all') renderList();
  if (v === 'cal') {
    // Kalendern öppnar på dagen som senast visades
    calSel = current;
    calMonth = current.slice(0, 7);
    renderCal();
  }
  window.scrollTo(0, 0);
}

$('tab-day').addEventListener('click', () => { setView('day'); showDay(todayKey()); });
$('tab-cal').addEventListener('click', () => setView('cal'));
$('tab-all').addEventListener('click', () => setView('all'));

if (location.hash === '#flode' || location.hash === '#alla') setView('all');
if (location.hash === '#kalender') setView('cal');
showDay(current);
connect();
</script>
