<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dagbok</title>
  <meta name="theme-color" content="#f3e6d5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dagbok">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section id="view-day" hidden>
      <div class="daynav">
        <button type="button" class="icon" id="prev" aria-label="Föregående dag">&#8249;</button>
        <label class="date">
          <span id="date-label"></span>
          <input type="date" id="date-pick" aria-label="Välj datum">
        </label>
        <button type="button" class="icon" id="next" aria-label="Nästa dag">&#8250;</button>
      </div>
      <button type="button" class="link" id="to-today" hidden>Gå till idag</button>

      <p class="weather" id="weather"></p>

      <form id="entry" autocomplete="off">
        <div class="field">
          <span id="text-label">Vad som hänt idag</span>
          <div class="writer">
            <div class="fmt" id="fmt" role="toolbar" aria-label="Formatering" aria-controls="f-text">
              <button type="button" data-cmd="bold" aria-label="Fet"><b>B</b></button>
              <button type="button" data-cmd="italic" aria-label="Kursiv"><i>K</i></button>
              <button type="button" data-cmd="h2">Rubrik</button>
              <button type="button" data-cmd="ul">Lista</button>
            </div>
            <div id="f-text" class="paper" contenteditable="true" role="textbox" aria-multiline="true"
              aria-labelledby="text-label" spellcheck="true"></div>
          </div>
        </div>

        <fieldset class="field mood">
          <legend>Humör</legend>
          <div class="scale" id="f-mood" role="radiogroup">
            <button type="button" role="radio" data-v="1" style="--m: var(--m1)" aria-label="1, tungt">1</button>
            <button type="button" role="radio" data-v="2" style="--m: var(--m2)">2</button>
            <button type="button" role="radio" data-v="3" style="--m: var(--m3)">3</button>
            <button type="button" role="radio" data-v="4" style="--m: var(--m4)">4</button>
            <button type="button" role="radio" data-v="5" style="--m: var(--m5)" aria-label="5, bra">5</button>
          </div>
          <div class="ends"><span>Tungt</span><span>Bra</span></div>
        </fieldset>
        <div class="field">
          <span>Bilder</span>
          <div class="photos" id="photos"></div>
          <button type="button" class="add-photo" id="add-photo">Lägg till bilder</button>
          <input type="file" id="photo-file" accept="image/*" multiple hidden>
          <p class="muted" id="photo-msg" aria-live="polite"></p>
        </div>
      </form>

      <div class="foot">
        <span id="status" aria-live="polite"></span>
        <button type="button" class="link danger" id="delete" hidden>Ta bort dagen</button>
      </div>
      <section class="memories" id="memories" aria-labelledby="memories-title" hidden>
        <h2 id="memories-title">Den här dagen</h2>
        <div id="memory-list"></div>
      </section>
    </section>

    <section id="view-cal" hidden>
      <div class="cal-head">
        <button type="button" class="icon" id="cal-prev" aria-label="Föregående månad">&#8249;</button>
        <h2 id="cal-title"></h2>
        <button type="button" class="icon" id="cal-next" aria-label="Nästa månad">&#8250;</button>
      </div>
      <div class="grid" id="cal-grid"></div>
      <div class="show">
        <span id="show-label">Visa</span>
        <div class="dropdown" id="show-dd">
          <button type="button" class="dd-btn" id="cal-show" aria-haspopup="listbox" aria-expanded="false"
            aria-labelledby="show-label cal-show">Inget extra</button>
          <ul class="dd-list" id="cal-show-list" role="listbox" aria-labelledby="show-label" hidden>
            <li role="option" tabindex="-1" data-value="">Inget extra</li>
            <li role="option" tabindex="-1" data-value="mood">Humör</li>
            <li role="option" tabindex="-1" data-value="weather">Väder</li>
          </ul>
        </div>
      </div>
      <div class="legend" id="legend" hidden>
        <span><i style="--m: var(--m1)"></i>1 tungt</span>
        <span><i style="--m: var(--m2)"></i>2</span>
        <span><i style="--m: var(--m3)"></i>3</span>
        <span><i style="--m: var(--m4)"></i>4</span>
        <span><i style="--m: var(--m5)"></i>5 bra</span>
      </div>
    </section>

    <section id="view-all" hidden>
      <input type="search" id="search" placeholder="Sök i dagboken" aria-label="Sök">
      <div id="list"></div>

      <div class="backup">
        <h2>Säkerhetskopia</h2>
        <p class="muted">Allt sparas bara på den här enheten. Exportera då och då.</p>
        <div class="buttons">
          <button type="button" id="export">Exportera fil</button>
          <button type="button" id="import">Importera fil</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </div>
    </section>
  </main>

  <dialog class="viewer" id="photo-viewer" aria-label="Bild">
    <img id="viewer-img" alt="">
    <div class="viewer-foot">
      <button type="button" class="link danger" id="photo-delete">Ta bort bilden</button>
      <span class="confirm" id="photo-confirm" hidden>
        <button type="button" class="link danger" id="photo-delete-yes">Ta bort</button>
        <button type="button" class="link" id="photo-delete-no">Avbryt</button>
      </span>
      <button type="button" class="link" id="viewer-close">Stäng</button>
    </div>
  </dialog>

  <dialog class="reader" id="reader" aria-labelledby="reader-title">
    <div class="reader-head">
      <button type="button" class="icon" id="reader-prev" aria-label="Föregående dag">&#8249;</button>
      <h2 id="reader-title"></h2>
      <button type="button" class="icon" id="reader-next" aria-label="Nästa dag">&#8250;</button>
      <button type="button" class="link" id="reader-close">Stäng</button>
    </div>
    <div class="reader-track" id="reader-track"></div>
  </dialog>


  <nav class="nav" aria-label="Vyer">
    <a id="tab-day" href="#/dag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>
      <span>Dag</span>
    </a>
    <a id="tab-cal" href="#/kalender">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Kalender</span>
    </a>
    <a id="tab-all" href="#/flode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg>
      <span>Flöde</span>
    </a>
  </nav>

  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
